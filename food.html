<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valheim Food Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <script src="shared/chrome.js" defer></script>
    <style>
        body {
            font-family: 'IM Fell English', serif;
            background-color: #FDF5E6;
            color: #4A3F35;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Only #tableWrap scrolls; nav/filter bar/footer keep their natural size. */
        main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        main > footer {
            flex: 0 0 auto;
        }
        .valheim-title {
            font-family: 'IM Fell English', serif;
            font-weight: 700;
            color: #4A3F35;
        }
        .card {
            background-color: #FAF3E0;
            border: 1px solid #D2B48C;
        }
        table {
            background-color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 1.3;
        }
        thead.valheim-title { font-family: 'Inter', sans-serif; font-weight: 700; }
        .col-small { font-size: 0.867rem; } /* table's 0.95rem, 1pt smaller */
        .filter-btn {
            background-color: #D2B48C;
            color: #4A3F35;
            font-size: 0.917rem; /* text-sm (14px) + 0.5pt */
            transition: background-color 0.15s, color 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #4A3F35;
            color: #FAF3E0;
        }
        /* Fork colors: red=Health, yellow=Stamina, purple=Eitr, gray=Balanced */
        .fork-label  { font-weight: 700; }
        .fork-White  { color: #8a8073; }
        .fork-Red    { color: #C0392B; }
        .fork-Yellow { color: #B8960C; }
        .fork-Blue   { color: #7B4FA0; }
        /* Row tint mirrors the Fork column: light red/yellow/purple, white for Balanced */
        tr.row-White  { background-color: #FFFFFF; }
        tr.row-Red    { background-color: #FBEAE8; }
        tr.row-Yellow { background-color: #FCF3D9; }
        tr.row-Blue   { background-color: #F1E9F7; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #C45A11; }
        th .sort-indicator { font-size: 0.75em; opacity: 0.6; margin-left: 0.25em; }
        tr.food-row:hover { background-color: rgba(210, 180, 140, 0.25); }
        td, th { padding: 0.25rem 0.55rem; white-space: nowrap; }
        #filterBar {
            flex: 0 0 auto;
        }
        /* Fills all remaining vertical space in the viewport and scrolls internally
           (both axes) so the header row can stick to the top of THAT box, and the
           page itself never needs its own scrollbar. */
        #tableWrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }
        thead th {
            position: sticky;
            top: 0;
            background-color: #4A3F35; /* matches thead's bg-[#4A3F35]; inherit only reaches the <tr>, not thead */
            z-index: 10;
        }
        /* Custom tooltip for boss-gated ingredient notes (replaces native title="") */
        .note-trigger {
            position: relative;
            display: inline-block;
            margin-left: 0.35rem;
            cursor: help;
        }
        .note-icon {
            font-size: 0.8rem;
            color: #C45A11;
            vertical-align: middle;
        }
        .note-tip {
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translate(-50%, 4px) scale(0.96);
            background: #2E2620;
            color: #FAF3E0;
            font-size: 0.78rem;
            font-weight: 400;
            font-style: normal;
            line-height: 1.35;
            padding: 0.5rem 0.65rem;
            border-radius: 0.4rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.28);
            white-space: normal;
            width: max-content;
            max-width: 260px;
            text-align: left;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease, transform 0.12s ease;
        }
        .note-tip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-bottom-color: #2E2620;
        }
        .note-trigger:hover .note-tip,
        .note-trigger:focus .note-tip {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 8px) scale(1);
        }
    </style>
</head>
<body>
    <main class="container mx-auto max-w-[1800px] px-3 py-4">

        <section id="filterBar" class="card rounded-lg px-3 py-2 mb-3">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <div id="biomeFilters" class="flex flex-wrap gap-1"></div>
                <div id="forkFilters" class="flex flex-wrap gap-1"></div>
                <div id="feastFilters" class="flex flex-wrap gap-1"></div>
                <span id="resultCount" class="text-stone-700 text-sm"></span>
            </div>
        </section>

        <section id="tableWrap" class="card rounded-lg overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-[#4A3F35] text-[#FAF3E0] valheim-title">
                    <tr>
                        <th class="sortable text-left" data-key="name">Food <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-center" data-key="fork">Fork <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="hp">HP <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="st">Stam <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="ei">Eitr <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="total">Total <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="heal">Heal <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="duration">Dur <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="weight">Wt <span class="sort-indicator">↕</span></th>
                        <th class="sortable text-right" data-key="stack">Stack <span class="sort-indicator">↕</span></th>
                        <th class="sortable col-small" data-key="tier">Biome <span class="sort-indicator">↕</span></th>
                        <th class="col-small">Source</th>
                        <th class="text-left">Ingredients</th>
                    </tr>
                </thead>
                <tbody id="foodTbody"></tbody>
            </table>
        </section>

        <footer class="text-center text-xs text-stone-600 mt-3 pb-3">
            Blank duration/healing = value unset in source (most Ashlands foods). Biome tier 1 Meadows → 7 Ashlands. The <span class="fork-label" style="color:#C45A11">ⓘ</span> next to an ingredient flags a Bog Witch boss-gated spice — hover or focus it for details.
        </footer>

    </main>

            { name: "Queen's jam",                hp:14, st:40, ei:0,  total:54,  fork:"Yellow", heal:2, duration:1200, weight:1,   stack:10, tier:2, biome:"Black Forest",  station:"Cauldron (1)",            ingredients:"Raspberries x8, Blueberries x6" },
            { name: "Minced meat sauce",          hp:40, st:13, ei:0,  total:53,  fork:"Red",    heal:3, duration:1500, weight:1,   stack:10, tier:2, biome:"Black Forest",  station:"Cauldron (1)",            ingredients:"Boar meat x1, Neck tail x1, Carrot x1" },
            { name: "Boar jerky",                 hp:23, st:23, ei:0,  total:46,  fork:"White",  heal:2, duration:1800, weight:0.5, stack:20, tier:2, biome:"Black Forest",  station:"Cauldron (1)",            ingredients:"Boar meat x1, Honey x1" },
            { name: "Carrot",                     hp:10, st:32, ei:0,  total:42,  fork:"Yellow", heal:1, duration:900,  weight:0.3, stack:50, tier:2, biome:"Black Forest",  station:"(Grown from carrot seeds)", ingredients:"" },
            { name: "Yellow mushroom",            hp:10, st:30, ei:0,  total:40,  fork:"Yellow", heal:1, duration:600,  weight:0.1, stack:50, tier:2, biome:"Black Forest",  station:"(Found in Burial Chambers)", ingredients:"" },
            { name: "Blueberries",                hp:8,  st:25, ei:0,  total:33,  fork:"Yellow", heal:1, duration:600,  weight:0.1, stack:50, tier:2, biome:"Black Forest",  station:"(Foraged in Black Forest)", ingredients:"" },

            // ── Tier 1 — Meadows ─────────────────────────────────────────────
            { name: "Cooked deer meat",           hp:35, st:12, ei:0,  total:47,  fork:"Red",    heal:2, duration:1200, weight:1,   stack:20, tier:1, biome:"Meadows",       station:"Cooking station",         ingredients:"Deer meat x1" },
            { name: "Cooked boar meat",           hp:30, st:10, ei:0,  total:40,  fork:"Red",    heal:2, duration:1200, weight:1,   stack:20, tier:1, biome:"Meadows",       station:"Cooking station",         ingredients:"Boar meat x1" },
            { name: "Grilled neck tail",          hp:25, st:8,  ei:0,  total:33,  fork:"Red",    heal:2, duration:1200, weight:0.5, stack:20, tier:1, biome:"Meadows",       station:"Cooking station",         ingredients:"Neck tail x1" },
            { name: "Honey",                      hp:8,  st:35, ei:0,  total:43,  fork:"Yellow", heal:1, duration:900,  weight:0.2, stack:50, tier:1, biome:"Meadows",       station:"(Beehive)",               ingredients:"" },
            { name: "Mushroom",                   hp:15, st:15, ei:0,  total:30,  fork:"White",  heal:1, duration:900,  weight:0.1, stack:50, tier:1, biome:"Meadows",       station:"(Meadows / Black Forest)",  ingredients:"" },
            { name: "Raspberries",                hp:7,  st:20, ei:0,  total:27,  fork:"Yellow", heal:1, duration:600,  weight:0.1, stack:50, tier:1, biome:"Meadows",       station:"(Foraged in Meadows)",    ingredients:"" },
        ];

        const BIOMES = [
            { tier:0, label:"All"          },
            { tier:1, label:"Meadows"      },
            { tier:2, label:"Black Forest" },
            { tier:3, label:"Swamp/Ocean"  },
            { tier:4, label:"Mountain"     },
            { tier:5, label:"Plains"       },
            { tier:6, label:"Mistlands"    },
            { tier:7, label:"Ashlands"     },
        ];
        const FORKS = ["All", "White", "Red", "Yellow", "Blue"];
        const FORK_LABELS = { White: "Balanced", Red: "Health", Yellow: "Stamina", Blue: "Eitr" };
        // A Feast is any dish cooked at the Food preparation table (long duration, boss-gated spice).
        const isFeast = f => f.station === "Food preparation table";
        const FEAST_STATES = ["Include Feasts", "Exclude Feasts", "Only Feasts"];

        // ── Persisted filter/sort state ──────────────────────────────────────
        const STORAGE_KEY = 'vkb-food-filters';
        function loadState() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch {
                return {};
            }
        }
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                biomes: [...activeBiomes],
                forks: [...activeForks],
                feastState,
                sortKey,
                sortDir,
            }));
        }
        const saved = loadState();

        // Biome and Fork filters are both multi-select: an empty Set means "show all".
        // Clicking "All" clears the Set; clicking an individual value toggles its membership.
        const activeBiomes = new Set(saved.biomes || []);
        const activeForks  = new Set(saved.forks || []);
        // Feast filter is a single tri-state button that cycles through FEAST_STATES on click.
        let feastState  = FEAST_STATES.includes(saved.feastState) ? saved.feastState : "Include Feasts";
        let sortKey     = saved.sortKey ?? "total";
        let sortDir     = saved.sortDir ?? -1; // -1 desc, 1 asc

        // ── Render filter buttons ────────────────────────────────────────────
        const biomeRow = document.getElementById('biomeFilters');
        BIOMES.forEach(b => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn px-3 py-1 rounded';
            btn.textContent = b.label;
            btn.onclick = () => {
                if (b.tier === 0) {
                    activeBiomes.clear();
                } else if (activeBiomes.has(b.tier)) {
                    activeBiomes.delete(b.tier);
                } else {
                    activeBiomes.add(b.tier);
                }
                refreshFilters();
                saveState();
                render();
            };
            biomeRow.appendChild(btn);
        });

        const forkRow = document.getElementById('forkFilters');
        FORKS.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn px-3 py-1 rounded';
            btn.textContent = f === "All" ? f : FORK_LABELS[f];
            btn.onclick = () => {
                if (f === "All") {
                    activeForks.clear();
                } else if (activeForks.has(f)) {
                    activeForks.delete(f);
                } else {
                    activeForks.add(f);
                }
                refreshFilters();
                saveState();
                render();
            };
            forkRow.appendChild(btn);
        });

        const feastRow = document.getElementById('feastFilters');
        const feastBtn = document.createElement('button');
        feastBtn.className = 'filter-btn px-3 py-1 rounded active';
        feastBtn.onclick = () => {
            feastState = FEAST_STATES[(FEAST_STATES.indexOf(feastState) + 1) % FEAST_STATES.length];
            refreshFilters();
            saveState();
            render();
        };
        feastRow.appendChild(feastBtn);
        // Fix the button's width to its longest label so it doesn't resize as it cycles.
        let feastBtnMaxWidth = 0;
        FEAST_STATES.forEach(label => {
            feastBtn.textContent = label;
            feastBtnMaxWidth = Math.max(feastBtnMaxWidth, feastBtn.offsetWidth);
        });
        feastBtn.style.minWidth = feastBtnMaxWidth + 'px';

        // Fix the result-count width too, so its changing digit count doesn't
        // reflow/shift the filter buttons in this space-between row. The widest
        // it can ever render is "Showing <total> of <total> foods" (filtered
        // counts have equal-or-fewer digits than the total).
        const resultCountEl = document.getElementById('resultCount');
        resultCountEl.style.textAlign = 'right';
        resultCountEl.textContent = `Showing ${FOODS.length} of ${FOODS.length} foods`;
        resultCountEl.style.minWidth = resultCountEl.offsetWidth + 'px';

        function refreshFilters() {
            [...biomeRow.children].forEach((b, i) => {
                const tier = BIOMES[i].tier;
                const isActive = tier === 0 ? activeBiomes.size === 0 : activeBiomes.has(tier);
                b.classList.toggle('active', isActive);
            });
            [...forkRow.children].forEach((b, i) => {
                const f = FORKS[i];
                const isActive = f === "All" ? activeForks.size === 0 : activeForks.has(f);
                b.classList.toggle('active', isActive);
            });
            feastBtn.textContent = feastState;
        }

        // Initial highlight: "All" is the default active state.
        refreshFilters();

        // ── Sortable headers ─────────────────────────────────────────────────
        document.querySelectorAll('th.sortable').forEach(th => {
            th.onclick = () => {
                const key = th.dataset.key;
                if (key === sortKey) sortDir = -sortDir;
                else { sortKey = key; sortDir = (typeof FOODS[0][key] === 'number') ? -1 : 1; }
                saveState();
                render();
            };
        });

        // ── Cell formatting helpers ──────────────────────────────────────────
        // "(Foraged in Mistlands)" -> "Mistlands"; otherwise just drop the parens.
        function formatSource(s) {
            if (!s) return '';
            const foraged = s.match(/^\(Foraged in (.+)\)$/i);
            if (foraged) return foraged[1];
            return s.replace(/[()]/g, '');
        }

        // "Blueberries x1, Cooked deer meat x2" -> "Blueberry, 2 Cooked deer meat"
        // noteHtml (if given) is attached to the LAST ingredient — that's always
        // the Bog Witch-gated one in this dataset's boss-locked feast recipes.
        function formatIngredients(str, noteHtml) {
            if (!str) return '';
            const parts = str.split(',').map(part => {
                const s = part.trim();
                const m = s.match(/^(.+?)\s*x(\d+(?:\.\d+)?)\s*(.*)$/i);
                if (!m) return s;
                let [, name, qty, rest] = m;
                name = name.trim();
                const isOne = qty === '1';
                if (isOne && /ies$/i.test(name)) name = name.replace(/ies$/i, 'y');
                const labeled = isOne ? name : `${qty} ${name}`;
                return rest ? `${labeled} ${rest}` : labeled;
            });
            if (noteHtml && parts.length) parts[parts.length - 1] += noteHtml;
            return parts.join(', ');
        }

        // ── Render rows ──────────────────────────────────────────────────────
        function render() {
            let rows = FOODS.filter(f =>
                (activeBiomes.size === 0 || activeBiomes.has(f.tier)) &&
                (activeForks.size === 0 || activeForks.has(f.fork)) &&
                (feastState === "Include Feasts" || (feastState === "Only Feasts") === isFeast(f))
            );

            rows.sort((a, b) => {
                const av = a[sortKey], bv = b[sortKey];
                if (av == null && bv == null) return 0;
                if (av == null) return 1;
                if (bv == null) return -1;
                if (typeof av === 'number') return (av - bv) * sortDir;
                return String(av).localeCompare(String(bv)) * sortDir;
            });

            document.getElementById('resultCount').textContent =
                `Showing ${rows.length} of ${FOODS.length} foods`;

            const tbody = document.getElementById('foodTbody');
            tbody.innerHTML = rows.map(f => {
                const noteHtml = f.note ? `<span class="note-trigger" tabindex="0" aria-label="${f.note}"><span class="note-icon" aria-hidden="true">ⓘ</span><span class="note-tip" aria-hidden="true">${f.note}</span></span>` : '';
                return `
                <tr class="food-row row-${f.fork} border-t border-stone-300">
                    <td class="font-semibold">${f.name}</td>
                    <td class="text-center"><span class="fork-label fork-${f.fork}">${FORK_LABELS[f.fork]}</span></td>
                    <td class="text-right">${f.hp}</td>
                    <td class="text-right">${f.st}</td>
                    <td class="text-right">${f.ei || ''}</td>
                    <td class="text-right font-bold">${f.total}</td>
                    <td class="text-right">${f.heal || ''}</td>
                    <td class="text-right">${f.duration ?? ''}</td>
                    <td class="text-right">${f.weight}</td>
                    <td class="text-right">${f.stack}</td>
                    <td class="col-small">${f.biome}</td>
                    <td class="col-small">${formatSource(f.station)}</td>
                    <td class="text-xs text-stone-700">${formatIngredients(f.ingredients, noteHtml)}</td>
                </tr>
            `;
            }).join('');

            // Update sort indicators
            document.querySelectorAll('th.sortable .sort-indicator').forEach(s => s.textContent = '↕');
            const active = document.querySelector(`th[data-key="${sortKey}"] .sort-indicator`);
            if (active) active.textContent = sortDir > 0 ? '↑' : '↓';
        }

        render();
    </script>
</body>
</html>
